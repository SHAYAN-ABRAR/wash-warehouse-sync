name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the public demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Build for /wash-warehouse-sync/
        run: npm run build:pages
      - name: Refuse to publish anything but the static build and synthetic demo data
        run: |
          test -f dist/index.html && test -f dist/404.html
          test -f dist/demo/manifest.json
          grep -q '"synthetic":true' dist/demo/manifest.json
          if find dist -type f \( -name '*.sqlite' -o -name '*.psql' -o -name '*.zip' \) | grep -q .; then
            echo "Unexpected data files in the build"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
