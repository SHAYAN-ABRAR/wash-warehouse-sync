name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install engine, local API and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Lint (ruff)
        run: ruff check packages tests scripts
      - name: Unit, integration and API tests
        run: python -m pytest -q -p no:cacheprovider
      - name: CLI smoke test
        run: wash-sync --help

  web:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Unit and component tests
        run: npm test
      - name: Type-check and build (GitHub Pages target)
        run: npm run build:pages
      - name: Build (local production target)
        run: npm run build:local
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the Pages build
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
