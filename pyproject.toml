[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wash-warehouse-sync"
version = "1.0.0"
description = "Incremental, auditable synchronization engine for the WASH groundwater infrastructure warehouse (single-sheet Excel)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WASH Warehouse Sync contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "rich>=13.7",
  "xlrd>=2.0.1",
  "openpyxl>=3.1.2",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "httpx>=0.27",
  "xlwt>=1.3",
  "ruff>=0.6",
]

[project.scripts]
wash-sync = "wash_sync.cli:main"

[tool.setuptools.packages.find]
where = ["packages/sync_core", "packages/local_api"]

[tool.setuptools.package-data]
wash_sync = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "scale: large synthetic workload tests (opt-in: pytest -m scale)",
]
addopts = "-m 'not scale' -q"
filterwarnings = ["ignore::DeprecationWarning:xlrd.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines allowed (formatter-free codebase); B008: Typer option defaults;
# B905: zip() over sequences whose equal length is guaranteed by construction;
# B023: per-row accessor closures are defined and used within the same loop iteration.
ignore = ["E501", "B008", "B905", "B023"]
